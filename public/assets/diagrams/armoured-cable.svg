<svg viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="200" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">ARMOURED CABLE</text>

  <!-- outer black jacket -->
  <circle cx="200" cy="250" r="150" fill="#111827"/>
  <!-- corrugated steel tape (checker ring) -->
  <circle cx="200" cy="250" r="132" fill="#f3f4f6"/>
  <g fill="#111827">
    <!-- simple checker pattern ring built from small squares -->
  </g>
  <circle cx="200" cy="250" r="132" fill="none" stroke="#111827" stroke-width="10" stroke-dasharray="6 6"/>
  <!-- light blue inner sheath -->
  <circle cx="200" cy="250" r="118" fill="#bfe3f5"/>
  <!-- aramid yarn ring -->
  <circle cx="200" cy="250" r="104" fill="#f1e6b8"/>
  <!-- white core filler -->
  <circle cx="200" cy="250" r="90" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>

  <!-- 6 loose-tube sub-units around a small central filler -->
  <circle cx="200" cy="250" r="18" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>

  <!-- helper to place 6 sub-units -->
  <!-- positions (cx,cy) around center at radius ~55, colors per standard code -->
  <g stroke-width="3">
    <circle cx="200" cy="195" r="32" fill="#ffffff" stroke="#1e3a8a"/>
    <circle cx="248" cy="222" r="32" fill="#ffffff" stroke="#ea580c"/>
    <circle cx="248" cy="278" r="32" fill="#ffffff" stroke="#6b7280"/>
    <circle cx="200" cy="305" r="32" fill="#ffffff" stroke="#7c2d12"/>
    <circle cx="152" cy="278" r="32" fill="#ffffff" stroke="#15803d"/>
    <circle cx="152" cy="222" r="32" fill="#ffffff" stroke="#111827"/>
  </g>

  <!-- fiber dots inside each sub-unit (12-colour code, 4 shown per tube) -->
  <g>
    <!-- top (blue ring) -->
    <circle cx="192" cy="190" r="3.2" fill="#1e3a8a"/><circle cx="201" cy="187" r="3.2" fill="#ea580c"/>
    <circle cx="209" cy="192" r="3.2" fill="#15803d"/><circle cx="197" cy="200" r="3.2" fill="#dc2626"/>
    <!-- right upper (orange) -->
    <circle cx="240" cy="217" r="3.2" fill="#1e3a8a"/><circle cx="249" cy="215" r="3.2" fill="#ea580c"/>
    <circle cx="257" cy="221" r="3.2" fill="#eab308"/><circle cx="246" cy="228" r="3.2" fill="#7c3aed"/>
    <!-- right lower (slate) -->
    <circle cx="240" cy="273" r="3.2" fill="#1e3a8a"/><circle cx="249" cy="271" r="3.2" fill="#ec4899"/>
    <circle cx="257" cy="277" r="3.2" fill="#06b6d4"/><circle cx="246" cy="284" r="3.2" fill="#111827"/>
    <!-- bottom (brown) -->
    <circle cx="192" cy="300" r="3.2" fill="#1e3a8a"/><circle cx="201" cy="297" r="3.2" fill="#ea580c"/>
    <circle cx="209" cy="303" r="3.2" fill="#ffffff" stroke="#9ca3af" stroke-width="0.6"/><circle cx="197" cy="311" r="3.2" fill="#dc2626"/>
    <!-- left lower (green) -->
    <circle cx="145" cy="273" r="3.2" fill="#1e3a8a"/><circle cx="154" cy="271" r="3.2" fill="#ea580c"/>
    <circle cx="162" cy="277" r="3.2" fill="#15803d"/><circle cx="150" cy="284" r="3.2" fill="#eab308"/>
    <!-- left upper (black) -->
    <circle cx="145" cy="217" r="3.2" fill="#1e3a8a"/><circle cx="154" cy="215" r="3.2" fill="#ea580c"/>
    <circle cx="162" cy="221" r="3.2" fill="#7c3aed"/><circle cx="150" cy="228" r="3.2" fill="#ec4899"/>
  </g>

  <!-- rip cords -->
  <circle cx="200" cy="112" r="4" fill="#e5e7eb" stroke="#374151"/>
  <circle cx="200" cy="388" r="4" fill="#e5e7eb" stroke="#374151"/>
</svg>
